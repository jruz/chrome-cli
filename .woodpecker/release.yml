when:
  - event: tag

steps:
  - name: BUILD
    image: bash
    environment:
      REVISION: ${CI_COMMIT_SHA}
    commands:
      - nix develop --command just setup
      - nix develop --command just release-build linux x64
      - nix develop --command just release-build linux arm64
      - nix develop --command just release-build darwin x64
      - nix develop --command just release-build darwin arm64
      - ls -la dist/

  - name: RELEASE
    image: bash
    environment:
      CODEBERG_TOKEN:
        from_secret: CODEBERG_TOKEN
    commands:
      - nix develop --command just release-upload ${CI_COMMIT_TAG}
