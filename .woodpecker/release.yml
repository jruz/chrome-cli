when:
  - event: tag

steps:
  - name: BUILD
    image: 127.0.0.1:5000/woodpecker-job:v0.0.17
    environment:
      REVISION: ${CI_COMMIT_SHA}
    commands:
      - . /entrypoint.sh
      - nix develop --command just setup
      - nix develop --command scripts/release-build.sh linux x64
      - nix develop --command scripts/release-build.sh linux arm64
      - nix develop --command scripts/release-build.sh darwin x64
      - nix develop --command scripts/release-build.sh darwin arm64

  - name: RELEASE
    image: 127.0.0.1:5000/woodpecker-job:v0.0.17
    environment:
      CODEBERG_TOKEN:
        from_secret: CODEBERG_TOKEN
    commands:
      - ls -la $${CI_REPO_NAME}-*
      - . /entrypoint.sh
      - nix develop --command just release-upload $${CI_COMMIT_TAG}
